name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      config: Release
      dotnet: 9.0.x
      cli-proj-file: Il2CppDumper/Il2CppDumper.csproj
      cli-build-dir: net9.0

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Install .NET ${{ env.dotnet }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.dotnet }}

    - name: Build CLI for release
      run: dotnet build ${{ env.cli-proj-file }} -c ${{ env.config }} -p:TargetFramework=${{ env.cli-build-dir }}

    - name: Generate release data
      run: |
        GIT_COMMIT_ID=$(echo "${{ github.sha }}" | cut -c 1-7)
        UPDATE_TIME=$(date -u +%Y%m%dT%H%M%SZ)
        echo "tag_name=v${UPDATE_TIME}" >> $GITHUB_ENV
        echo "release_name=${UPDATE_TIME} (${GIT_COMMIT_ID})" >> $GITHUB_ENV
        echo "cli_zip_name=Il2CppDumper-CLI-${UPDATE_TIME}_${GIT_COMMIT_ID}.zip" >> $GITHUB_ENV

    - name: Create release archive
      run: |
        mkdir -p "$RUNNER_TEMP/builtfiles"
        cd Il2CppDumper/bin/${{ env.config }}/${{ env.cli-build-dir }}
        zip -r "$RUNNER_TEMP/builtfiles/${{ env.cli_zip_name }}" .

    - name: Upload packaged artifacts
      uses: actions/upload-artifact@v4.6.2
      with:
        name: packaged-release-assets
        path: ${{ runner.temp }}/builtfiles/${{ env.cli_zip_name }}
        if-no-files-found: error

    - name: Release with notes
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ env.release_name }}
        tag_name: ${{ env.tag_name }}
        generate_release_notes: true
        overwrite_files: false
        files: ${{ runner.temp }}/builtfiles/${{ env.cli_zip_name }}
